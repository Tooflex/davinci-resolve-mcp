name: Tests

on:
  pull_request:
  push:

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify editable installation
        run: |
          python -m pip install --no-deps -e .
          python -c "import importlib.metadata as m; assert any(e.name == 'davinci-resolve-mcp' and e.value == 'server:main' for e in m.distribution('davinci-resolve-mcp').entry_points)"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
